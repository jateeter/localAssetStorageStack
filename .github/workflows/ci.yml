name: CI

# Minimal by design (RealityEngine_CI docs/ENGINEERING_CONTRACT.md, "this
# repository is the authority"): enough to force local validation, never enough
# to stand in for it. The stack is verified live by RealityEngine_CI's local
# lane, which pins this repo, runs the lifecycle tests and builds its images.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Lifecycle tests
        run: npm test
        working-directory: lifecycle
      - name: Validate compose
        run: |
          cp .env.example .env
          sed -i 's/=$/=0123456789abcdef0123/' .env
          docker compose config -q
      - name: Build images
        run: |
          docker build -t lifecycle ./lifecycle
          docker build -t dokieli ./dokieli
      - name: Smoke test
        run: |
          docker run -d --name lc -p 8080:8080 -e ADMIN_TOKEN=0123456789abcdef0123 lifecycle
          for i in $(seq 20); do curl -fs localhost:8080/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/assets)" = 401
