name: CI

# Minimal by design (RealityEngine_CI docs/ENGINEERING_CONTRACT.md, "this
# repository is the authority"): enough to force local validation, never enough
# to stand in for it. The stack is verified live by RealityEngine_CI's local
# lane, which pins this repo, runs the lifecycle tests and builds its images.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Lifecycle tests
        run: npm test
        working-directory: lifecycle
      - name: Account provisioning tests
        run: node --test scripts/*.test.js
      - name: Validate compose
        run: |
          cp .env.example .env
          sed -i 's/=$/=0123456789abcdef0123456789abcdef/' .env
          mkdir -p .secrets && echo '[]' > .secrets/css-seed.json && echo '{}' > .secrets/lifecycle-account.json
          docker compose config -q
      - name: Build images
        run: |
          docker build -t lifecycle ./lifecycle
          docker build -t dokieli ./dokieli
      - name: Smoke test
        run: |
          # TLS only (RealityEngine_CI#668): a throwaway certificate for the
          # smoke test; curl verifies against it with --cacert.
          mkdir -p "$RUNNER_TEMP/pki"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:secp384r1 -nodes -sha384 -days 1 \
            -subj /CN=localhost -addext subjectAltName=DNS:localhost \
            -keyout "$RUNNER_TEMP/pki/key.pem" -out "$RUNNER_TEMP/pki/cert.pem"
          chmod 644 "$RUNNER_TEMP/pki/key.pem"
          # No assets-css here: the service serves while its identity retries.
          echo '{"email":"lifecycle@assets.localhost","password":"x","pod":"lifecycle"}' > "$RUNNER_TEMP/pki/account.json"
          docker run -d --name lc -p 8443:8443 -v "$RUNNER_TEMP/pki:/pki:ro" \
            -e ADMIN_TOKEN=0123456789abcdef0123456789abcdef -e TLS_KEY_FILE=/pki/key.pem -e TLS_CERT_FILE=/pki/cert.pem \
            -e CSS_ORIGIN=https://assets-css.localhost:13443 -e SERVICE_ACCOUNT_FILE=/pki/account.json lifecycle
          C=(curl --tlsv1.3 --cacert "$RUNNER_TEMP/pki/cert.pem")
          for i in $(seq 20); do "${C[@]}" -fs https://localhost:8443/health && break; sleep 1; done
          test "$("${C[@]}" -s -o /dev/null -w '%{http_code}' https://localhost:8443/assets)" = 401
          # A TLS 1.2-only client is refused.
          ! curl --tlsv1.2 --tls-max 1.2 --cacert "$RUNNER_TEMP/pki/cert.pem" -fs https://localhost:8443/health
