# dokieli + Solid Community Server + asset lifecycle API for the Reality Engine.
# Attach to existing stacks (localAIStack / localOpenClawStack) via the external
# network "reality-engine" (docker network create reality-engine).
services:
  css:
    image: solidproject/community-server:7
    command: ["-c", "/config/config.json", "-f", "/data", "-b", "${CSS_BASE_URL:-http://css:3000/}"]
    volumes:
      - css-data:/data
      - ./css/config.json:/config/config.json:ro
    ports:
      - target: 3000
        published: "${CSS_HOST_PORT:-0}"
        host_ip: 127.0.0.1
    networks: [reality-engine]
    restart: unless-stopped

  dokieli:
    build: ./dokieli
    ports:
      - target: 8080
        published: "${DOKIELI_HOST_PORT:-0}"
        host_ip: 127.0.0.1
    networks: [reality-engine]
    restart: unless-stopped

  lifecycle:
    build: ./lifecycle
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set in .env}
      REGISTRAR_TOKEN: ${REGISTRAR_TOKEN:?set in .env}
      ENGINE_TOKEN: ${ENGINE_TOKEN:?set in .env}
      AGENT_TOKEN: ${AGENT_TOKEN:?set in .env}
      REVIEWER_TOKEN: ${REVIEWER_TOKEN:?set in .env}
      RECEIPT_SECRET: ${RECEIPT_SECRET:?set in .env}
      CSS_ORIGIN: http://css:3000
      REGISTRY_FILE: /registry/registry.json
    volumes:
      - lifecycle-data:/data
      - ./runtime:/registry:ro
    ports:
      - target: 8080
        published: "${LIFECYCLE_HOST_PORT:-0}"
        host_ip: 127.0.0.1
    networks: [reality-engine]
    depends_on: [css]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  css-data:
  lifecycle-data:

networks:
  reality-engine:
    name: reality-engine
