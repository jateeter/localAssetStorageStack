# assets-dokieli on TLS 1.3 under RealityEngine_CI config/transport-profile.json
# (RealityEngine_CI#668, localAssetStorageStack#15). The certificate is issued
# by RealityEngine_CI scripts/lib/re_pki.py and mounted at /pki/self.
server {
  listen 13444 ssl;
  http2 on;
  server_name assets-dokieli.localhost;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  ssl_certificate     /pki/self/chain.pem;
  ssl_certificate_key /pki/self/key.pem;
  ssl_protocols TLSv1.3;
  ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
  ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1;
  ssl_session_tickets off;
  # Plain HTTP on this TLS port (nginx's 497) gets no reply at all: the
  # connection is closed, never answered in plaintext.
  error_page 497 = @plaintext;
  location @plaintext { return 444; }

  add_header Strict-Transport-Security "max-age=63072000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;
  location ~ /\. { deny all; }
  location /node_modules/ { deny all; }
  location / { try_files $uri $uri/ /index.html; }
}
